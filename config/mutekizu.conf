# mutekizu configuration (key=value; '#' starts a comment)
#
# This tool splits the TCP segments carrying a TLS ClientHello for the listed
# SNI names. It does not tunnel, proxy, NAT or alter TLS. It works only for
# TCP; QUIC/UDP is out of scope.

# --- strategies ---------------------------------------------------------
# SNI ClientHello splitter (NFQUEUE). Needs CAP_NET_RAW.
split_enabled=true
# MSS rewrite in SYN-ACK (nftables only, no userspace data path).
# Targets are explicit IPs from mss_targets_file; ports above are shared.
mss_clamp=false
mss_value=96
mss_targets_file=/etc/mutekizu/mss_targets.txt

queue_num=2000
fwmark=0x44495054
max_queue_len=256
copy_range=65535

# Default split strategy: multi-split through the whole SNI.
# Lab and real-path experiments showed multi-split is more useful than one
# break at the start of the name; a single break remains available with
# split_stride=0. More boundaries mean more segments and more overhead.
split_delta=4
split_stride=4
split_max=64
# Experimental: delay between raw split segments (0 = back-to-back).
# A non-zero gap did not improve the real-path result in tests; keep 0.
split_gap_ms=0
# Tuned working default: disorder + fake + seqovl + UDP fake STUN.
# These were validated on the real Discord path; disable individually if a
# network does not like them.
split_disorder=true
split_multidisorder=false
split_data=false
split_data_pos=1
split_jitter_ms=0
fake_enabled=true
fake_ttl=3
fake_repeats=3
fake_sni=www.microsoft.com
seqovl_enabled=true
seqovl_bytes=646
seqovl_repeats=1
# UDP fake STUN for Discord/RTC (voice ports 19294-19344, 50000-50100).
udp_fake_enabled=true
udp_fake_ttl=4
udp_fake_repeats=5
# Maximum TCP payload per segment we emit (keep below the smallest path MTU).
mss=1200
# Only this many first original-direction packets per connection are queued.
inspect_packets=10

ipv4=true
ipv6=false
ports=443,8080,80,83
domains_file=/etc/mutekizu/domains.txt
# Optional per-domain overrides (see config/profiles.conf)
profiles_file=/etc/mutekizu/profiles.conf
# Rotate to the next matching profile when the previous attempt did not get
# past the ClientHello (the client retried within this window).
auto_profile=true
auto_retry_window_s=10

log_level=info
# Never enable this in normal use: it writes hostnames to the journal.
log_sni=false

# Auto-discovery: for an unknown SNI, probe the destination once (no split).
# If the direct TLS handshake gets no response, add the SNI to the auto list
# and split it on the next connection. Probes use SO_MARK so they bypass the
# queue. This reveals the SNI to the same destination and doubles connections;
# it is off-switchable and bounded.
auto_discover=true
auto_domains_file=/var/lib/mutekizu/auto-domains.txt
auto_probe_timeout_ms=2500
auto_probe_max=4
auto_domain_limit=4096
auto_probe_interval_s=600

max_flows=1024
flow_buffer=8192
flow_timeout_s=30

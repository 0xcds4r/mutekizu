# Optional per-domain strategy overrides.
#
# Global defaults live in mutekizu.conf. A profile only overrides the keys it
# lists. Sections are matched in file order; the first matching domain wins.
#
# [discord]
# domains = discord.com, discord.gg, gateway.discord.gg
# split_disorder = true
# split_multidisorder = false
# fake_enabled = true
# fake_ttl = 3
# fake_repeats = 3
# fake_sni = www.microsoft.com
# seqovl_enabled = true
# seqovl_bytes = 646
#
# [youtube]
# domains = youtube.com, googlevideo.com, ytimg.com
# split_delta = 4
# split_stride = 4
# split_disorder = false
# fake_enabled = false

[telegram]
domains = telegram.org, t.me, telegram.me, web.telegram.org, desktop.telegram.org, api.telegram.org, core.telegram.org, cdn.telegram.org
split_disorder = true
fake_enabled = true
fake_sni = www.microsoft.com
seqovl_enabled = true
seqovl_bytes = 646
